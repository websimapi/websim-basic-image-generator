<html>
<head>
  <base href="./">
  <title>AI Image Editor</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      font-family: Arial, sans-serif;
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      width: 95%;
      text-align: center;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .input-group {
      margin-bottom: 2rem;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    input, select {
      padding: 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    input {
      width: 100%;
      min-width: 200px;
      max-width: 400px;
    }

    select {
      width: 100%;
      min-width: 120px;
      max-width: 200px;
      cursor: pointer;
    }

    select option {
      background: #16213e;
      color: white;
    }

    button {
      padding: 0.8rem 1.5rem;
      font-size: 0.9rem;
      background: #4CAF50;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
      white-space: nowrap;
      min-width: 120px;
    }

    button:hover {
      transform: scale(1.05);
    }

    .image-container {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .loading {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .placeholder-text {
      color: rgba(255,255,255,0.6);
      font-size: 1.2rem;
    }

    .generated-image {
      max-width: 100%;
      max-height: 500px;
      border-radius: 5px;
    }

    .save-button {
      margin-top: 1rem;
      background: #2196F3;
    }

    .add-gallery-button {
      margin-top: 1rem;
      background: #9c27b0;
      margin-left: 1rem;
    }

    .editor-controls {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .color-picker {
      padding: 0.5rem;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 5px;
      width: 50px;
      height: 50px;
      cursor: pointer;
      margin: 0 5px;
      vertical-align: middle;
    }

    .color-display {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      margin-left: 10px;
      flex-wrap: wrap;
      width: 100%;
      justify-content: center;
    }

    .color-preview {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 2px solid white;
      margin-right: 8px;
    }

    .color-value {
      color: white;
      font-family: monospace;
    }

    .tool-group {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 8px;
      flex-wrap: wrap;
    }

    .tool-button {
      padding: 0.6rem;
      background: #2196F3;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-button svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .tool-button:hover {
      background: #1976D2;
      transform: translateY(-1px);
    }

    .tool-button.active {
      background: #1565C0;
      box-shadow: 0 0 10px rgba(25,118,210,0.4);
    }

    .tool-button:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      margin-bottom: 5px;
    }

    .tool-button:hover::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(0,0,0,0.8);
      margin-bottom: -5px;
    }

    canvas {
      max-width: 100%;
      max-height: 500px;
      border-radius: 5px;
      display: none;
    }

    canvas.magic-wand {
      cursor: crosshair;
    }

    .fill-image-prompt {
      width: 100%;
      margin-top: 1rem;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .fill-image-prompt input {
      flex: 1;
      min-width: 200px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      width: 100%;
      padding: 1rem;
    }

    .gallery-item {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .gallery-item .metadata {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    .gallery-item .stats {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 400px;
      min-width: 200px;
    }

    .search-container input {
      width: 100%;
      padding: 0.8rem;
      padding-left: 2.5rem;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 5px;
      color: white;
    }

    .search-container input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.2rem;
      height: 1.2rem;
      fill: rgba(255,255,255,0.6);
      pointer-events: none;
    }

    .no-results {
      text-align: center;
      padding: 2rem;
      color: rgba(255,255,255,0.6);
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
      }

      .input-group {
        gap: 6px;
      }

      input, select {
        padding: 0.8rem;
        font-size: 0.9rem;
      }

      .tool-group {
        gap: 0.5rem;
      }

      .editor-controls {
        gap: 0.5rem;
      }

      .color-picker {
        width: 40px;
        height: 40px;
      }

      .color-preview {
        width: 20px;
        height: 20px;
      }

      .image-container {
        padding: 0.5rem;
      }

      .generated-image {
        max-height: 400px;
      }

      canvas {
        max-height: 400px;
      }
    }

    @media (max-width: 600px) {
      .gallery-header {
        flex-direction: column;
      }

      .search-container {
        width: 100%;
        max-width: none;
      }
    }

    .gallery-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    .pagination-button {
      background: #2196F3;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pagination-button:hover {
      background: #1976D2;
    }

    .pagination-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #pageInfo {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    .editor-section {
      margin-bottom: 3rem;
      padding: 2rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    .prompt-history {
      margin: 8px 0;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
    }

    .prompt-history-header {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .prompt-history-header svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
      margin-left: 4px;
    }

    .prompt-history-entries {
      display: none;
      padding: 8px;
    }

    .prompt-history-entry {
      padding: 4px;
      border-left: 2px solid rgba(255,255,255,0.2);
      margin: 4px 0;
    }

    .prompt-history-entry .timestamp {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }

    .by-user {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }

    .image-title {
      font-weight: bold;
      cursor: default;
    }

    .image-title[onclick] {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-icon {
      opacity: 0.5;
      font-size: 0.8em;
    }

    .image-title[onclick]:hover .edit-icon {
      opacity: 1;
    }

    #editTitleDialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #2a2a3a;
      padding: 20px;
      border-radius: 8px;
      z-index: 1001;
      width: 90%;
      max-width: 400px;
    }

    .dialog-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dialog-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Image Editor</h1>
    
    <div class="editor-section">
      <div class="input-group">
        <select id="prefixPrompt">
          <option value="">Select Prefix...</option>
          <option value="HD ">HD</option>
          <option value="4K ">4K</option>
          <option value="Cartoon style ">Cartoon</option>
          <option value="Realistic ">Realistic</option>
          <option value="Photorealistic ">Photorealistic</option>
          <option value="Black and white ">Black & White</option>
          <option value="Vintage ">Vintage</option>
          <option value="Anime style ">Anime</option>
        </select>
        <input type="text" id="promptInput" placeholder="Enter your image prompt here...">
        <select id="suffixPrompt">
          <option value="">Select Suffix...</option>
          <option value=", white background">White Background</option>
          <option value=", black background">Black Background</option>
          <option value=", green background">Green Background</option>
          <option value=", blue background">Blue Background</option>
          <option value=", high quality">High Quality</option>
          <option value=", detailed">Detailed</option>
          <option value=", 8K">8K</option>
          <option value=", professional lighting">Professional Lighting</option>
        </select>
        <button onclick="generateImage()">Generate</button>
        <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" style="display:none">
        <button onclick="document.getElementById('imageUpload').click()">Load Image</button>
      </div>

      <div class="image-container" id="imageContainer">
        <div id="loadingSpinner" class="loading" style="display: none;"></div>
        <div id="placeholderText" class="placeholder-text">Enter a prompt to generate an image or load one from your device</div>
        <canvas id="editCanvas"></canvas>
        <div class="editor-controls" id="editorControls">
          <div class="tool-group">
            <button class="tool-button" onclick="setTool('magicWand')" id="magicWandTool" data-tooltip="Magic Wand">

              </svg>
            </button>
            
            <button class="tool-button" onclick="setTool('fillSelection')" id="fillSelectionTool" data-tooltip="Fill Selection">
              <svg viewBox="0 0 24 24">

              </svg>
            </button>

            <button class="tool-button" onclick="setTool('setAlpha')" id="setAlphaTool" data-tooltip="Set Alpha">
              <svg viewBox="0 0 24 24">
                <path d="M17.66,8L12,2.35L6.34,8C4.78,9.56 4.78,12.11 6.34,13.66L12,19.31L17.66,13.66C19.22,12.11 19.22,9.56 17.66,8M6,18V15L4,17L2.86,15.86L4.86,13.86L2,11V14L4,16L5.14,17.14L3.14,19.14L6,22V19L4,17"/>
              </svg>
            </button>

            <button class="tool-button" onclick="setTool('fillWithImage')" id="fillWithImageTool" data-tooltip="Fill with Generated Image">
              <svg viewBox="0 0 24 24">
                <path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/>
              </svg>
            </button>

            <button class="tool-button" onclick="clearSelection()" id="clearSelectionTool" data-tooltip="Clear Selection">
              <svg viewBox="0 0 24 24">
                <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/>
              </svg>
            </button>

            <div class="color-display">
              <div class="color-preview" id="colorPreview"></div>
              <input type="color" id="colorPicker" class="color-picker" value="#ffffff">
              <span class="color-value" id="colorValue">#FFFFFF</span>
            </div>
          </div>
          
          <div class="fill-image-prompt" id="fillImagePrompt" style="display: none;">
            <input type="text" id="selectionPromptInput" placeholder="Enter prompt for selected region...">
            <button onclick="generateSelectionFill()">Prompt Fill Image</button>
          </div>
          
          <button onclick="resetImage()">Reset Image</button>
        </div>
      </div>

      <div class="action-buttons">
        <button onclick="saveImage()" class="save-button" id="saveButton">Save Image</button>
        <button onclick="addToGallery()" class="add-gallery-button" id="addGalleryButton">Add to Gallery</button>
      </div>
    </div>

    <div class="gallery-container">
      <div class="gallery-header">
        <div class="gallery-tabs">
          <button class="gallery-tab active" onclick="showGalleryTab('recent')">Recent</button>
          <button class="gallery-tab" onclick="showGalleryTab('popular')">Popular</button>
          <button class="gallery-tab" onclick="showGalleryTab('my')">My Images</button>
        </div>
        <div class="search-container">
          <input type="text" id="gallerySearch" placeholder="Search images by title or username..." onkeyup="filterGallery()">
