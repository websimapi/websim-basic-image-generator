<html><head><base href="./"><title>Basic Image Generator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    font-family: Arial, sans-serif;
    padding: 2rem;
  }

  .container {
    max-width: 800px;
    width: 95%;
    text-align: center;
    padding: 10px;
  }

  h1 {
    margin-bottom: 2rem;
    font-size: 2.5rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .input-group {
    margin-bottom: 2rem;
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  input, select {
    padding: 1rem;
    font-size: 1rem;
    border: none;
    border-radius: 5px;
    background: rgba(255,255,255,0.1);
    color: white;
  }

  input {
    width: 100%;
    min-width: 200px;
    max-width: 400px;
  }

  select {
    width: 100%;
    min-width: 120px;
    max-width: 200px;
    cursor: pointer;
  }

  select option {
    background: #16213e;
    color: white;
  }

  button {
    padding: 0.8rem 1.5rem;
    font-size: 0.9rem;
    background: #4CAF50;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
    white-space: nowrap;
    min-width: 120px;
  }

  button:hover {
    transform: scale(1.05);
  }

  .image-container {
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .loading {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4CAF50;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .placeholder-text {
    color: rgba(255,255,255,0.6);
    font-size: 1.2rem;
  }

  .generated-image {
    max-width: 100%;
    max-height: 500px;
    border-radius: 5px;
  }

  .save-button {
    margin-top: 1rem;
    background: #2196F3;
  }

  .editor-controls {
    margin-top: 1rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .color-picker {
    padding: 0.5rem;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 5px;
    width: 50px;
    height: 50px;
    cursor: pointer;
    margin: 0 5px;
    vertical-align: middle;
  }

  .color-display {
    display: inline-flex;
    align-items: center;
    padding: 5px 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 5px;
    margin-left: 10px;
    flex-wrap: wrap;
    width: 100%;
    justify-content: center;
  }

  .color-preview {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: 2px solid white;
    margin-right: 8px;
  }

  .color-value {
    color: white;
    font-family: monospace;
  }

  .tool-group {
    display: flex;
    gap: 0.8rem;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 8px;
    border-radius: 8px;
    flex-wrap: wrap;
  }

  .tool-button {
    padding: 0.6rem 1rem;
    background: #2196F3;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    font-size: 0.8rem;
  }

  .tool-button:hover {
    background: #1976D2;
    transform: translateY(-1px);
  }

  .tool-button.active {
    background: #1565C0;
    box-shadow: 0 0 10px rgba(25,118,210,0.4);
  }

  canvas {
    max-width: 100%;
    max-height: 500px;
    border-radius: 5px;
    display: none;
  }

  canvas.magic-wand {
    cursor: crosshair;
  }

  .selection-rect {
    position: absolute;
    border: 2px dashed white;
    background: rgba(255,255,255,0.1);
    pointer-events: none;
  }

  @media (max-width: 600px) {
    body {
      padding: 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    .input-group {
      gap: 6px;
    }

    input, select {
      padding: 0.8rem;
      font-size: 0.9rem;
    }

    .tool-group {
      gap: 0.5rem;
    }

    .editor-controls {
      gap: 0.5rem;
    }

    .color-picker {
      width: 40px;
      height: 40px;
    }

    .color-preview {
      width: 20px;
      height: 20px;
    }

    .image-container {
      padding: 0.5rem;
    }

    .generated-image {
      max-height: 400px;
    }

    canvas {
      max-height: 400px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>AI Image Generator</h1>
  <div class="input-group">
    <select id="prefixPrompt">
      <option value>Select Prefix...</option>
      <option value="HD ">HD</option>
      <option value="4K ">4K</option>
      <option value="Cartoon style ">Cartoon</option>
      <option value="Realistic ">Realistic</option>
      <option value="Photorealistic ">Photorealistic</option>
      <option value="Black and white ">Black &amp; White</option>
      <option value="Vintage ">Vintage</option>
      <option value="Anime style ">Anime</option>
    </select>
    <input type="text" id="promptInput" placeholder="Enter your image prompt here...">
    <select id="suffixPrompt">
      <option value>Select Suffix...</option>
      <option value=", white background">White Background</option>
      <option value=", black background">Black Background</option>
      <option value=", green background">Green Background</option>
      <option value=", blue background">Blue Background</option>
      <option value=", high quality">High Quality</option>
      <option value=", detailed">Detailed</option>
      <option value=", 8K">8K</option>
      <option value=", professional lighting">Professional Lighting</option>
    </select>
    <button onclick="generateImage()">Generate</button>
    <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" style="display:none">
    <button onclick="document.getElementById(&apos;imageUpload&apos;).click()">Upload Image</button>
  </div>
  <div class="image-container" id="imageContainer">
    <div id="loadingSpinner" class="loading" style="display: none;"></div>
    <div id="placeholderText" class="placeholder-text">Enter a prompt to generate an image</div>
    <canvas id="editCanvas"></canvas>
    <div class="editor-controls" id="editorControls" style="display: none;">
      <div class="tool-group">
        <button class="tool-button" onclick="setTool(&apos;magicWand&apos;)" id="magicWandTool">Magic Wand</button>
        <button class="tool-button" onclick="setTool(&apos;fillSelection&apos;)" id="fillSelectionTool">Fill Selection</button>
        <button class="tool-button" onclick="setTool(&apos;setAlpha&apos;)" id="setAlphaTool">Set Alpha</button>
        <button class="tool-button" onclick="clearSelection()" id="clearSelectionTool">Clear Selection</button>
        <button class="tool-button" onclick="setTool(&apos;select&apos;)" id="selectTool">Select</button>
        <button class="tool-button" onclick="cropToSelection()" id="cropTool">Crop</button>
        <div class="color-display">
          <div class="color-preview" id="colorPreview"></div>
          <input type="color" id="colorPicker" class="color-picker" value="#ffffff">
          <span class="color-value" id="colorValue">#FFFFFF</span>
        </div>
      </div>
      <button onclick="resetImage()">Reset Image</button>
    </div>
  </div>
  <button onclick="saveImage()" class="save-button" id="saveButton" style="display: none;">Save Image</button>
</div>

<script>let imageCounter = 0;
let currentImage = null;
let originalImageData = null;
let currentSelection = null;
let isShiftPressed = false;
let isCtrlPressed = false;
let isSelecting = false;
let selectionRect = null;
let selectionStart = {
  x: 0,
  y: 0
};
let currentTool = null;
document.addEventListener('keydown', function (e) {
  if (e.shiftKey) isShiftPressed = true;
  if (e.ctrlKey) isCtrlPressed = true;
});
document.addEventListener('keyup', function (e) {
  if (!e.shiftKey) isShiftPressed = false;
  if (!e.ctrlKey) isCtrlPressed = false;
});
function generateImage() {
  const prefixSelect = document.getElementById('prefixPrompt');
  const promptInput = document.getElementById('promptInput');
  const suffixSelect = document.getElementById('suffixPrompt');
  const imageContainer = document.getElementById('imageContainer');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const placeholderText = document.getElementById('placeholderText');
  const saveButton = document.getElementById('saveButton');
  const editorControls = document.getElementById('editorControls');
  const fullPrompt = `${prefixSelect.value}${promptInput.value.trim()}${suffixSelect.value}`;
  if (!promptInput.value.trim()) {
    alert('Please enter a prompt!');
    return;
  }
  loadingSpinner.style.display = 'block';
  placeholderText.style.display = 'none';
  saveButton.style.display = 'none';
  editorControls.style.display = 'none';
  const existingImages = imageContainer.querySelectorAll('img');
  existingImages.forEach(img => img.remove());
  const generatedImage = document.createElement('img');
  generatedImage.id = `generatedImage_${imageCounter++}`;
  generatedImage.className = 'generated-image';
  generatedImage.style.display = 'none';
  generatedImage.crossOrigin = 'anonymous';
  generatedImage.src = fullPrompt;
  generatedImage.alt = fullPrompt;
  imageContainer.appendChild(generatedImage);
  generatedImage.onload = function () {
    loadingSpinner.style.display = 'none';
    generatedImage.style.display = 'block';
    placeholderText.style.display = 'none';
    saveButton.style.display = 'block';
    currentImage = generatedImage;
    setupImageEditor();
  };
}
function setupImageEditor() {
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const editorControls = document.getElementById('editorControls');
  canvas.width = currentImage.naturalWidth;
  canvas.height = currentImage.naturalHeight;
  ctx.drawImage(currentImage, 0, 0);
  originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  currentImage.style.display = 'none';
  canvas.style.display = 'block';
  editorControls.style.display = 'flex';
  canvas.addEventListener('click', handleCanvasClick);
  if (!document.querySelector('.selection-rect')) {
    const selDiv = document.createElement('div');
    selDiv.className = 'selection-rect';
    canvas.parentElement.appendChild(selDiv);
    selectionRect = selDiv;
  }
  canvas.addEventListener('mousedown', startSelection);
  canvas.addEventListener('mousemove', updateSelection);
  canvas.addEventListener('mouseup', endSelection);
}
function handleCanvasClick(e) {
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  if (!isShiftPressed && !isCtrlPressed) {
    currentSelection = null;
  }
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const newSelection = magicWandSelect(imageData, Math.round(x), Math.round(y), 32);
  if (isShiftPressed || isCtrlPressed) {
    if (currentSelection) {
      for (let i = 0; i < currentSelection.length; i++) {
        currentSelection[i] = currentSelection[i] || newSelection[i];
      }
    } else {
      currentSelection = newSelection;
    }
  } else {
    currentSelection = newSelection;
  }
  drawSelectionOverlay();
}
function magicWandSelect(imageData, startX, startY, tolerance) {
  const width = imageData.width;
  const height = imageData.height;
  const pixels = imageData.data;
  const visited = new Uint8Array(width * height);
  const selected = new Uint8Array(width * height);
  const startPos = (startY * width + startX) * 4;
  const startR = pixels[startPos];
  const startG = pixels[startPos + 1];
  const startB = pixels[startPos + 2];
  const stack = [[startX, startY]];
  while (stack.length) {
    const [x, y] = stack.pop();
    const pos = y * width + x;
    if (x < 0 || x >= width || y < 0 || y >= height || visited[pos]) {
      continue;
    }
    const pixelPos = pos * 4;
    const r = pixels[pixelPos];
    const g = pixels[pixelPos + 1];
    const b = pixels[pixelPos + 2];
    const colorDiff = Math.sqrt(Math.pow(r - startR, 2) + Math.pow(g - startG, 2) + Math.pow(b - startB, 2));
    if (colorDiff <= tolerance) {
      visited[pos] = 1;
      selected[pos] = 1;
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
  }
  return selected;
}
function drawSelectionOverlay() {
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  ctx.putImageData(originalImageData, 0, 0);
  if (!currentSelection) return;
  const width = canvas.width;
  const height = canvas.height;
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 2;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const pos = y * width + x;
      if (currentSelection[pos]) {
        const isEdge = x > 0 && !currentSelection[pos - 1] || x < width - 1 && !currentSelection[pos + 1] || y > 0 && !currentSelection[pos - width] || y < height - 1 && !currentSelection[pos + width];
        if (isEdge) {
          ctx.fillStyle = 'white';
          ctx.fillRect(x - 1, y - 1, 3, 3);
          ctx.strokeStyle = 'black';
          ctx.strokeRect(x - 1, y - 1, 3, 3);
        }
      }
    }
  }
}
function setTool(tool) {
  const canvas = document.getElementById('editCanvas');
  if (tool === 'fillSelection' && currentSelection) {
    fillSelection();
  } else if (tool === 'setAlpha' && currentSelection) {
    setSelectionAlpha();
  }
  canvas.className = tool === 'magicWand' ? 'magic-wand' : '';
  if (tool === 'select') {
    canvas.style.cursor = 'crosshair';
    if (selectionRect) selectionRect.style.display = 'none';
  }
}
function fillSelection() {
  if (!currentSelection) return;
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = imageData.data;
  const color = document.getElementById('colorPicker').value;
  const r = parseInt(color.substr(1, 2), 16);
  const g = parseInt(color.substr(3, 2), 16);
  const b = parseInt(color.substr(5, 2), 16);
  for (let i = 0; i < currentSelection.length; i++) {
    if (currentSelection[i]) {
      const pixelPos = i * 4;
      pixels[pixelPos] = r;
      pixels[pixelPos + 1] = g;
      pixels[pixelPos + 2] = b;
    }
  }
  ctx.putImageData(imageData, 0, 0);
  originalImageData = imageData;
}
function setSelectionAlpha() {
  if (!currentSelection) return;
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = imageData.data;
  for (let i = 0; i < currentSelection.length; i++) {
    if (currentSelection[i]) {
      const pixelPos = i * 4;
      pixels[pixelPos + 3] = 0;
    }
  }
  ctx.putImageData(imageData, 0, 0);
  originalImageData = imageData;
}
function clearSelection() {
  currentSelection = null;
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  ctx.putImageData(originalImageData, 0, 0);
}
function resetImage() {
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  ctx.putImageData(originalImageData, 0, 0);
  currentSelection = null;
}
function saveImage() {
  const canvas = document.getElementById('editCanvas');
  const link = document.createElement('a');
  link.download = 'edited-image.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
function handleImageUpload(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const uploadedImage = new Image();
      uploadedImage.onload = function () {
        currentImage = uploadedImage;
        setupImageEditor();
      };
      uploadedImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}
document.getElementById('promptInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') {
    generateImage();
  }
});
document.getElementById('colorPicker').addEventListener('input', function (e) {
  document.getElementById('colorPreview').style.backgroundColor = e.target.value;
  document.getElementById('colorValue').textContent = e.target.value.toUpperCase();
});
document.getElementById('colorPreview').style.backgroundColor = document.getElementById('colorPicker').value;
document.getElementById('colorValue').textContent = document.getElementById('colorPicker').value.toUpperCase();
function startSelection(e) {
  if (currentTool !== 'select') return;
  isSelecting = true;
  const rect = e.target.getBoundingClientRect();
  selectionStart.x = e.clientX - rect.left;
  selectionStart.y = e.clientY - rect.top;
  if (selectionRect) {
    selectionRect.style.display = 'block';
    selectionRect.style.left = selectionStart.x + 'px';
    selectionRect.style.top = selectionStart.y + 'px';
    selectionRect.style.width = '0px';
    selectionRect.style.height = '0px';
  }
}
function updateSelection(e) {
  if (!isSelecting) return;
  const rect = e.target.getBoundingClientRect();
  const currentX = e.clientX - rect.left;
  const currentY = e.clientY - rect.top;
  const width = currentX - selectionStart.x;
  const height = currentY - selectionStart.y;
  if (selectionRect) {
    selectionRect.style.width = Math.abs(width) + 'px';
    selectionRect.style.height = Math.abs(height) + 'px';
    selectionRect.style.left = (width < 0 ? currentX : selectionStart.x) + 'px';
    selectionRect.style.top = (height < 0 ? currentY : selectionStart.y) + 'px';
  }
}
function endSelection() {
  isSelecting = false;
}
function cropToSelection() {
  if (!selectionRect) return;
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const rect = selectionRect.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / canvasRect.width;
  const scaleY = canvas.height / canvasRect.height;
  const x = (rect.left - canvasRect.left) * scaleX;
  const y = (rect.top - canvasRect.top) * scaleY;
  const width = rect.width * scaleX;
  const height = rect.height * scaleY;
  const imageData = ctx.getImageData(x, y, width, height);
  canvas.width = width;
  canvas.height = height;
  ctx.putImageData(imageData, 0, 0);
  originalImageData = imageData;
  selectionRect.style.display = 'none';
}
document.getElementById('editCanvas').addEventListener('mousedown', startSelection);
document.getElementById('editCanvas').addEventListener('mousemove', updateSelection);
document.addEventListener('mouseup', endSelection);
document.getElementById('cropButton').addEventListener('click', cropToSelection);
selectionRect = document.createElement('div');
selectionRect.style.position = 'absolute';
selectionRect.style.border = '1px solid black';
selectionRect.style.display = 'none';
document.body.appendChild(selectionRect);</script>

</body></html>
