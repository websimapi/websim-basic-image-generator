<html><head><base href="./"><title>Basic Image Generator</title><style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    font-family: Arial, sans-serif;
    padding: 2rem;
  }

  .container {
    max-width: 800px;
    width: 100%;
    text-align: center;
  }

  h1 {
    margin-bottom: 2rem;
    font-size: 2.5rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .input-group {
    margin-bottom: 2rem;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  input, select {
    padding: 1rem;
    font-size: 1rem;
    border: none;
    border-radius: 5px;
    background: rgba(255,255,255,0.1);
    color: white;
  }

  input {
    width: 50%;
  }

  select {
    width: auto;
    cursor: pointer;
  }

  select option {
    background: #16213e;
    color: white;
  }

  button {
    padding: 1rem 2rem;
    font-size: 1rem;
    background: #4CAF50;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
    white-space: nowrap;
  }

  button:hover {
    transform: scale(1.05);
  }

  .image-container {
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .loading {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #4CAF50;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .placeholder-text {
    color: rgba(255,255,255,0.6);
    font-size: 1.2rem;
  }

  .generated-image {
    max-width: 100%;
    max-height: 500px;
    border-radius: 5px;
  }

  .save-button {
    margin-top: 1rem;
    background: #2196F3;
  }

  .toolbar {
    margin: 1rem 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .threshold-control {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
  }

  #selectionCanvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .magic-select-btn {
    background: #9c27b0;
  }
</style></head><body><div class="container"><h1>AI Image Generator</h1><div class="input-group">
  <select id="prefixPrompt">
    <option value="">Select Prefix...</option>
    <option value="HD ">HD</option>
    <option value="4K ">4K</option>
    <option value="Cartoon style ">Cartoon</option>
    <option value="Realistic ">Realistic</option>
    <option value="Photorealistic ">Photorealistic</option>
    <option value="Black and white ">Black & White</option>
    <option value="Vintage ">Vintage</option>
    <option value="Anime style ">Anime</option>
  </select>
  <input type="text" id="promptInput" placeholder="Enter your image prompt here...">
  <select id="suffixPrompt">
    <option value="">Select Suffix...</option>
    <option value=", white background">White Background</option>
    <option value=", black background">Black Background</option>
    <option value=", green background">Green Background</option>
    <option value=", blue background">Blue Background</option>
    <option value=", high quality">High Quality</option>
    <option value=", detailed">Detailed</option>
    <option value=", 8K">8K</option>
    <option value=", professional lighting">Professional Lighting</option>
  </select>
  <button onclick="generateImage()">Generate</button>
  <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" style="display:none">
  <button onclick="document.getElementById('imageUpload').click()">Upload Image</button>
</div>

<div class="toolbar">
  <button class="magic-select-btn" onclick="toggleMagicSelect()">Magic Select Tool</button>
  <div class="threshold-control">
    <label for="threshold">Threshold:</label>
    <input type="range" id="threshold" min="1" max="100" value="30">
    <span id="thresholdValue">30</span>
  </div>
</div>

<div class="image-container" id="imageContainer">
  <div id="loadingSpinner" class="loading" style="display: none;"></div>
  <div id="placeholderText" class="placeholder-text">Enter a prompt to generate an image</div>
  <canvas id="selectionCanvas" style="display: none;"></canvas>
</div>
<button onclick="saveImage()" class="save-button" id="saveButton" style="display: none;">Save Image</button>
</div><script>
let imageCounter = 0;
let magicSelectActive = false;
let selection = new Set();
let currentImage = null;

function generateImage() {
  const prefixSelect = document.getElementById('prefixPrompt');
  const promptInput = document.getElementById('promptInput');
  const suffixSelect = document.getElementById('suffixPrompt');
  const imageContainer = document.getElementById('imageContainer');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const placeholderText = document.getElementById('placeholderText');
  const saveButton = document.getElementById('saveButton');
  const selectionCanvas = document.getElementById('selectionCanvas');

  const fullPrompt = `${prefixSelect.value}${promptInput.value.trim()}${suffixSelect.value}`;

  if (!promptInput.value.trim()) {
    alert('Please enter a prompt!');
    return;
  }

  loadingSpinner.style.display = 'block';
  placeholderText.style.display = 'none';
  saveButton.style.display = 'none';
  selectionCanvas.style.display = 'none';
  selection.clear();

  // Remove any existing images
  const existingImages = imageContainer.querySelectorAll('img');
  existingImages.forEach(img => img.remove());

  // Create new image element
  const generatedImage = document.createElement('img');
  generatedImage.id = `generatedImage_${imageCounter++}`;
  generatedImage.className = 'generated-image';
  generatedImage.style.display = 'none';
  generatedImage.crossOrigin = 'anonymous';
  generatedImage.src = fullPrompt;
  generatedImage.alt = fullPrompt;
  imageContainer.appendChild(generatedImage);

  generatedImage.onload = function() {
    loadingSpinner.style.display = 'none';
    generatedImage.style.display = 'block';
    placeholderText.style.display = 'none';
    saveButton.style.display = 'block';
    currentImage = generatedImage;
    setupSelectionCanvas();
  };
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    const saveButton = document.getElementById('saveButton');
    const selectionCanvas = document.getElementById('selectionCanvas');
    
    reader.onload = function(e) {
      const imageContainer = document.getElementById('imageContainer');
      const placeholderText = document.getElementById('placeholderText');
      
      // Remove any existing images
      const existingImages = imageContainer.querySelectorAll('img');
      existingImages.forEach(img => img.remove());

      const uploadedImage = document.createElement('img');
      uploadedImage.id = `uploadedImage_${imageCounter++}`;
      uploadedImage.className = 'generated-image';
      uploadedImage.src = e.target.result;
      uploadedImage.crossOrigin = 'anonymous';
      
      imageContainer.appendChild(uploadedImage);
      placeholderText.style.display = 'none';
      saveButton.style.display = 'block';
      currentImage = uploadedImage;
      
      uploadedImage.onload = function() {
        setupSelectionCanvas();
      };
    };
    reader.readAsDataURL(file);
  }
}

function toggleMagicSelect() {
  magicSelectActive = !magicSelectActive;
  const btn = document.querySelector('.magic-select-btn');
  btn.style.background = magicSelectActive ? '#ff4081' : '#9c27b0';
}

function setupSelectionCanvas() {
  const canvas = document.getElementById('selectionCanvas');
  const imageContainer = document.getElementById('imageContainer');
  canvas.style.display = 'block';
  canvas.width = currentImage.width;
  canvas.height = currentImage.height;
  canvas.style.position = 'absolute';
  canvas.style.left = currentImage.offsetLeft + 'px';
  canvas.style.top = currentImage.offsetTop + 'px';

  canvas.onclick = handleMagicSelect;
}

function handleMagicSelect(e) {
  if (!magicSelectActive || !currentImage) return;

  const canvas = document.getElementById('selectionCanvas');
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = currentImage.width;
  tempCanvas.height = currentImage.height;
  const ctx = tempCanvas.getContext('2d');
  ctx.drawImage(currentImage, 0, 0, tempCanvas.width, tempCanvas.height);

  const imageData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
  const threshold = document.getElementById('threshold').value;
  const selectedPixels = magicWand(imageData, x, y, threshold);

  if (e.ctrlKey) {
    // Add to existing selection
    selectedPixels.forEach(pixel => selection.add(pixel));
  } else {
    // New selection
    selection = new Set(selectedPixels);
  }

  drawSelection();
}

function magicWand(imageData, startX, startY, threshold) {
  const width = imageData.width;
  const height = imageData.height;
  const pixels = imageData.data;
  const startPos = (startY * width + startX) * 4;
  const startColor = {
    r: pixels[startPos],
    g: pixels[startPos + 1],
    b: pixels[startPos + 2],
    a: pixels[startPos + 3]
  };

  const stack = [[startX, startY]];
  const selectedPixels = new Set();
  const visited = new Set();

  while (stack.length) {
    const [x, y] = stack.pop();
    const pos = (y * width + x) * 4;
    const key = `${x},${y}`;

    if (visited.has(key)) continue;
    visited.add(key);

    const currentColor = {
      r: pixels[pos],
      g: pixels[pos + 1],
      b: pixels[pos + 2],
      a: pixels[pos + 3]
    };

    if (colorMatch(startColor, currentColor, threshold)) {
      selectedPixels.add(key);

      // Check neighboring pixels
      if (x > 0) stack.push([x - 1, y]);
      if (x < width - 1) stack.push([x + 1, y]);
      if (y > 0) stack.push([x, y - 1]);
      if (y < height - 1) stack.push([x, y + 1]);
    }
  }

  return selectedPixels;
}

function colorMatch(c1, c2, threshold) {
  const delta = threshold * 2.55; // Convert percentage to 0-255 range
  return Math.abs(c1.r - c2.r) <= delta &&
         Math.abs(c1.g - c2.g) <= delta &&
         Math.abs(c1.b - c2.b) <= delta;
}

function drawSelection() {
  const canvas = document.getElementById('selectionCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#00ff00';
  ctx.lineWidth = 1;

  selection.forEach(key => {
    const [x, y] = key.split(',').map(Number);
    ctx.strokeRect(x, y, 1, 1);
  });
}

function saveImage() {
  if (!currentImage) return;
  
  const canvas = document.createElement('canvas');
  canvas.width = currentImage.naturalWidth;
  canvas.height = currentImage.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(currentImage, 0, 0);
  
  // Apply selection mask if exists
  if (selection.size > 0) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    selection.forEach(key => {
      const [x, y] = key.split(',').map(Number);
      const pos = (y * canvas.width + x) * 4;
      imageData.data[pos + 3] = 0; // Set alpha to 0
    });
    ctx.putImageData(imageData, 0, 0);
  }
  
  const link = document.createElement('a');
  link.download = 'edited-image.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById('promptInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    generateImage();
  }
});

document.getElementById('threshold').addEventListener('input', function(e) {
  document.getElementById('thresholdValue').textContent = e.target.value;
});
