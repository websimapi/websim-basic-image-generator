<html>
<head>
  <base href="./">
  <title>AI Image Editor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="gallery.js"></script>
  <script src="imageEditor.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      font-family: Arial, sans-serif;
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      width: 95%;
      text-align: center;
      padding: 10px;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .input-group {
      margin-bottom: 2rem;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    input, select {
      padding: 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    input {
      width: 100%;
      min-width: 200px;
      max-width: 400px;
    }

    select {
      width: 100%;
      min-width: 120px;
      max-width: 200px;
      cursor: pointer;
    }

    select option {
      background: #16213e;
      color: white;
    }

    button {
      padding: 0.8rem 1.5rem;
      font-size: 0.9rem;
      background: #4CAF50;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
      white-space: nowrap;
      min-width: 120px;
    }

    button:hover {
      transform: scale(1.05);
    }

    .image-container {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .loading {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .placeholder-text {
      color: rgba(255,255,255,0.6);
      font-size: 1.2rem;
    }

    .generated-image {
      max-width: 100%;
      max-height: 500px;
      border-radius: 5px;
    }

    .save-button {
      margin-top: 1rem;
      background: #2196F3;
    }

    .add-gallery-button {
      margin-top: 1rem;
      background: #9c27b0;
      margin-left: 1rem;
    }

    .editor-controls {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .color-picker {
      padding: 0.5rem;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 5px;
      width: 50px;
      height: 50px;
      cursor: pointer;
      margin: 0 5px;
      vertical-align: middle;
    }

    .color-display {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      margin-left: 10px;
      flex-wrap: wrap;
      width: 100%;
      justify-content: center;
    }

    .color-preview {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 2px solid white;
      margin-right: 8px;
    }

    .color-value {
      color: white;
      font-family: monospace;
    }

    .tool-group {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 8px;
      flex-wrap: wrap;
    }

    .tool-button {
      padding: 0.6rem;
      background: #2196F3;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-button svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .tool-button:hover {
      background: #1976D2;
      transform: translateY(-1px);
    }

    .tool-button.active {
      background: #1565C0;
      box-shadow: 0 0 10px rgba(25,118,210,0.4);
    }

    .tool-button:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      margin-bottom: 5px;
    }

    .tool-button:hover::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(0,0,0,0.8);
      margin-bottom: -5px;
    }

    canvas {
      max-width: 100%;
      max-height: 500px;
      border-radius: 5px;
      display: none;
    }

    canvas.magic-wand {
      cursor: crosshair;
    }

    .fill-image-prompt {
      width: 100%;
      margin-top: 1rem;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .fill-image-prompt input {
      flex: 1;
      min-width: 200px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      width: 100%;
      padding: 1rem;
    }

    .gallery-item {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
    }

    .gallery-item .metadata {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    .gallery-item .stats {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 400px;
      min-width: 200px;
    }

    .search-container input {
      width: 100%;
      padding: 0.8rem;
      padding-left: 2.5rem;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 5px;
      color: white;
    }

    .search-container input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.2rem;
      height: 1.2rem;
      fill: rgba(255,255,255,0.6);
      pointer-events: none;
    }

    .no-results {
      text-align: center;
      padding: 2rem;
      color: rgba(255,255,255,0.6);
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
      }

      .input-group {
        gap: 6px;
      }

      input, select {
        padding: 0.8rem;
        font-size: 0.9rem;
      }

      .tool-group {
        gap: 0.5rem;
      }

      .editor-controls {
        gap: 0.5rem;
      }

      .color-picker {
        width: 40px;
        height: 40px;
      }

      .color-preview {
        width: 20px;
        height: 20px;
      }

      .image-container {
        padding: 0.5rem;
      }

      .generated-image {
        max-height: 400px;
      }

      canvas {
        max-height: 400px;
      }
    }

    @media (max-width: 600px) {
      .gallery-header {
        flex-direction: column;
      }

      .search-container {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Image Editor</h1>
    
    <div class="editor-section">
      <div class="input-group">
        <select id="prefixPrompt">
          <option value="">Select Prefix...</option>
          <option value="HD ">HD</option>
          <option value="4K ">4K</option>
          <option value="Cartoon style ">Cartoon</option>
          <option value="Realistic ">Realistic</option>
          <option value="Photorealistic ">Photorealistic</option>
          <option value="Black and white ">Black & White</option>
          <option value="Vintage ">Vintage</option>
          <option value="Anime style ">Anime</option>
        </select>
        <input type="text" id="promptInput" placeholder="Enter your image prompt here...">
        <select id="suffixPrompt">
          <option value="">Select Suffix...</option>
          <option value=", white background">White Background</option>
          <option value=", black background">Black Background</option>
          <option value=", green background">Green Background</option>
          <option value=", blue background">Blue Background</option>
          <option value=", high quality">High Quality</option>
          <option value=", detailed">Detailed</option>
          <option value=", 8K">8K</option>
          <option value=", professional lighting">Professional Lighting</option>
        </select>
        <button onclick="generateImage()">Generate</button>
        <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" style="display:none">
        <button onclick="document.getElementById('imageUpload').click()">Load Image</button>
      </div>

      <div class="image-container" id="imageContainer">
        <div id="loadingSpinner" class="loading" style="display: none;"></div>
        <div id="placeholderText" class="placeholder-text">Enter a prompt to generate an image or load one from your device</div>
        <canvas id="editCanvas"></canvas>
        <div class="editor-controls" id="editorControls">
          <div class="tool-group">
            <button class="tool-button" onclick="setTool('magicWand')" id="magicWandTool" data-tooltip="Magic Wand">
              <svg viewBox="0 0 24 24">
                <path d="M7,5L3,9L9,15L13,11L7,5M16,12L12,16L14,18L18,14L16,12M12.8,2.6L16,5.8L18.6,3.2L15.4,0L12.8,2.6M21.4,11.6L24,14.2L21.4,16.8L18.8,14.2L21.4,11.6M0,18L3,21L5.6,18.4L2.6,15.4L0,18Z"/>
              </svg>
            </button>
            
            <button class="tool-button" onclick="setTool('fillSelection')" id="fillSelectionTool" data-tooltip="Fill Selection">
              <svg viewBox="0 0 24 24">
                <path d="M19,11.5C19,11.5 17,13.67 17,15A2,2 0 0,0 19,17A2,2 0 0,0 21,15C21,13.67 19,11.5 19,11.5M5.21,10L10,5.21L14.79,10M16.56,8.94L7.62,0L6.21,1.41L8.59,3.79L3.44,8.94C2.85,9.5 2.85,10.47 3.44,11.06L8.94,16.56C9.23,16.85 9.62,17 10,17C10.38,17 10.77,16.85 11.06,16.56L16.56,11.06C17.15,10.47 17.15,9.5 16.56,8.94Z"/>
              </svg>
            </button>

            <button class="tool-button" onclick="setTool('setAlpha')" id="setAlphaTool" data-tooltip="Set Alpha">
              <svg viewBox="0 0 24 24">
                <path d="M17.66,8L12,2.35L6.34,8C4.78,9.56 4.78,12.11 6.34,13.66L12,19.31L17.66,13.66C19.22,12.11 19.22,9.56 17.66,8M6,18V15L4,17L2.86,15.86L4.86,13.86L2,11V14L4,16L5.14,17.14L3.14,19.14L6,22V19L4,17"/>
              </svg>
            </button>

            <button class="tool-button" onclick="setTool('fillWithImage')" id="fillWithImageTool" data-tooltip="Fill with Generated Image">
              <svg viewBox="0 0 24 24">
                <path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/>
              </svg>
            </button>

            <button class="tool-button" onclick="clearSelection()" id="clearSelectionTool" data-tooltip="Clear Selection">
              <svg viewBox="0 0 24 24">
                <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/>
              </svg>
            </button>

            <div class="color-display">
              <div class="color-preview" id="colorPreview"></div>
              <input type="color" id="colorPicker" class="color-picker" value="#ffffff">
              <span class="color-value" id="colorValue">#FFFFFF</span>
            </div>
          </div>
          
          <div class="fill-image-prompt" id="fillImagePrompt" style="display: none;">
            <input type="text" id="selectionPromptInput" placeholder="Enter prompt for selected region...">
            <button onclick="generateSelectionFill()">Prompt Fill Image</button>
          </div>
          
          <button onclick="resetImage()">Reset Image</button>
        </div>
      </div>

      <div class="action-buttons">
        <button onclick="saveImage()" class="save-button" id="saveButton">Save Image</button>
        <button onclick="addToGallery()" class="add-gallery-button" id="addGalleryButton">Add to Gallery</button>
      </div>
    </div>

    <div class="gallery-container">
      <div class="gallery-header">
        <div class="gallery-tabs">
          <button class="gallery-tab active" onclick="showGalleryTab('recent')">Recent</button>
          <button class="gallery-tab" onclick="showGalleryTab('popular')">Popular</button>
          <button class="gallery-tab" onclick="showGalleryTab('my')">My Images</button>
        </div>
        <div class="search-container">
          <input type="text" id="gallerySearch" placeholder="Search images by title or username..." onkeyup="filterGallery()">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/>
          </svg>
        </div>
      </div>
      <div id="gallery" class="gallery"></div>
      <div class="gallery-pagination" id="galleryPagination">
        <button onclick="changePage(-1)" class="pagination-button" id="prevPage">Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button onclick="changePage(1)" class="pagination-button" id="nextPage">Next</button>
      </div>
    </div>
  </div>

  <script>
    let room;
    let galleryImages = [];
    let currentTab = 'recent';
    let currentEditId = null;
    let currentSearch = '';
    let imageCounter = 0;
    let currentImage = null;
    let originalImageData = null;
    let currentSelection = null;
    let isShiftPressed = false;
    let isCtrlPressed = false;
    let selectionCanvas = null;
    let selectionCtx = null;
    
    window.addEventListener('load', async () => {
      room = new WebsimSocket();
      await initGallery();
      setupImageEditor();
    });

    async function initGallery() {
      galleryImages = await room.collection('gallery_images').getList();
      room.collection('gallery_images').subscribe(images => {
        galleryImages = images;
        renderGallery();
      });
      renderGallery();
    }

    function renderGallery() {
      const galleryEl = document.getElementById('gallery');
      let images = [...galleryImages];
      
      if (currentSearch) {
        const searchLower = currentSearch.toLowerCase();
        images = images.filter(img => 
          img.prompt.toLowerCase().includes(searchLower) || 
          img.username.toLowerCase().includes(searchLower)
        );
      }

      switch (currentTab) {
        case 'popular':
          images.sort((a, b) => (b.views || 0) - (a.views || 0));
          break;
        case 'my':
          images = images.filter(img => img.username === room.party.client.username);
          break;
        default:
          images.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      if (images.length === 0) {
        galleryEl.innerHTML = `
          <div class="no-results">
            ${currentSearch ? 'No images found matching your search' : 'No images available'}
          </div>
        `;
        return;
      }

      galleryEl.innerHTML = images.map(img => `
        <div class="gallery-item">
          <img src="${img.imageUrl}" alt="${img.prompt}" onclick="loadGalleryImage('${img.id}')">
          <div class="metadata">
            <div>${img.prompt}</div>
            <div>by ${img.username}</div>
            <div>${new Date(img.created_at).toLocaleDateString()}</div>
          </div>
          <div class="stats">
            <span>${img.views || 0} views</span>
            <span>${img.uses || 0} uses</span>
          </div>
          ${img.username === room.party.client.username ? `
            <div class="gallery-item-controls">
              <button class="edit-button" onclick="editImage('${img.id}')">Edit</button>
              <button class="delete-button" onclick="deleteImage('${img.id}')">Delete</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function showGalleryTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.gallery-tab').forEach(el => {
        el.classList.toggle('active', el.textContent.toLowerCase().includes(tab));
      });
      renderGallery();
    }

    async function loadGalleryImage(id) {
      const image = galleryImages.find(img => img.id === id);
      if (!image) return;
      await room.collection('gallery_images').update(id, {
        views: (image.views || 0) + 1
      });
      const imageContainer = document.getElementById('imageContainer');
      const existingImages = imageContainer.querySelectorAll('img');
      existingImages.forEach(img => img.remove());
      const generatedImage = document.createElement('img');
      generatedImage.id = `generatedImage_${imageCounter++}`;
      generatedImage.className = 'generated-image';
      generatedImage.style.display = 'none';
      generatedImage.crossOrigin = 'anonymous';
      generatedImage.src = image.imageUrl;
      generatedImage.alt = image.prompt;
      imageContainer.appendChild(generatedImage);
      currentImage = generatedImage;
      document.getElementById('saveButton').style.display = 'block';
      document.getElementById('addGalleryButton').style.display = 'block';
      currentImage.onload = function () {
        setupImageEditor();
      };
    }

    function setupImageEditor() {
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      const editorControls = document.getElementById('editorControls');
      const fillImagePrompt = document.getElementById('fillImagePrompt');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const placeholderText = document.getElementById('placeholderText');
      loadingSpinner.style.display = 'none';
      placeholderText.style.display = 'none';
      if (currentImage) {
        canvas.width = currentImage.naturalWidth;
        canvas.height = currentImage.naturalHeight;
        ctx.drawImage(currentImage, 0, 0);
        originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        currentImage.style.display = 'none';
        canvas.style.display = 'block';
        editorControls.style.display = 'flex';
      } else {
        canvas.style.display = 'none';
        editorControls.style.display = 'flex';
      }
      fillImagePrompt.style.display = 'none';
      if (!canvas.hasEventListener) {
        canvas.addEventListener('click', handleCanvasClick);
        canvas.hasEventListener = true;
      }
    }

    function handleCanvasClick(e) {
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      if (!isShiftPressed && !isCtrlPressed) {
        currentSelection = null;
      }
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const newSelection = magicWandSelect(imageData, Math.round(x), Math.round(y), 32);
      if (isShiftPressed || isCtrlPressed) {
        if (currentSelection) {
          for (let i = 0; i < currentSelection.length; i++) {
            currentSelection[i] = currentSelection[i] || newSelection[i];
          }
        } else {
          currentSelection = newSelection;
        }
      } else {
        currentSelection = newSelection;
      }
      drawSelectionOverlay();
    }

    function magicWandSelect(imageData, startX, startY, tolerance) {
      const width = imageData.width;
      const height = imageData.height;
      const pixels = imageData.data;
      const visited = new Uint8Array(width * height);
      const selected = new Uint8Array(width * height);
      const startPos = (startY * width + startX) * 4;
      const startR = pixels[startPos];
      const startG = pixels[startPos + 1];
      const startB = pixels[startPos + 2];
      const stack = [[startX, startY]];
      while (stack.length) {
        const [x, y] = stack.pop();
        const pos = y * width + x;
        if (x < 0 || x >= width || y < 0 || y >= height || visited[pos]) {
          continue;
        }
        const pixelPos = pos * 4;
        const r = pixels[pixelPos];
        const g = pixels[pixelPos + 1];
        const b = pixels[pixelPos + 2];
        const colorDiff = Math.sqrt(Math.pow(r - startR, 2) + Math.pow(g - startG, 2) + Math.pow(b - startB, 2));
        if (colorDiff <= tolerance) {
          visited[pos] = 1;
          selected[pos] = 1;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      return selected;
    }

    function drawSelectionOverlay() {
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      ctx.putImageData(originalImageData, 0, 0);
      if (!currentSelection) return;
      const width = canvas.width;
      const height = canvas.height;
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const pos = y * width + x;
          if (currentSelection[pos]) {
            const isEdge = x > 0 && !currentSelection[pos - 1] || x < width - 1 && !currentSelection[pos + 1] || y > 0 && !currentSelection[pos - width] || y < height - 1 && !currentSelection[pos + width];
            if (isEdge) {
              ctx.fillStyle = 'white';
              ctx.fillRect(x - 1, y - 1, 3, 3);
              ctx.strokeStyle = 'black';
              ctx.strokeRect(x - 1, y - 1, 3, 3);
            }
          }
        }
      }
    }

    function setTool(tool) {
      const canvas = document.getElementById('editCanvas');
      const fillImagePrompt = document.getElementById('fillImagePrompt');
      
      document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));
      
      const toolButton = document.getElementById(`${tool}Tool`);
      if (toolButton) {
        toolButton.classList.add('active');
      }

      if (tool === 'fillSelection' && currentSelection) {
        fillImagePrompt.style.display = 'none';
        fillSelection();
      } else if (tool === 'setAlpha' && currentSelection) {
        fillImagePrompt.style.display = 'none';
        setSelectionAlpha();
      } else if (tool === 'fillWithImage' && currentSelection) {
        fillImagePrompt.style.display = 'flex';
      } else {
        fillImagePrompt.style.display = 'none';
      }
      canvas.className = tool === 'magicWand' ? 'magic-wand' : '';
    }

    function fillSelection() {
      if (!currentSelection) return;
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;
      const color = document.getElementById('colorPicker').value;
      const r = parseInt(color.substr(1, 2), 16);
      const g = parseInt(color.substr(3, 2), 16);
      const b = parseInt(color.substr(5, 2), 16);
      for (let i = 0; i < currentSelection.length; i++) {
        if (currentSelection[i]) {
          const pixelPos = i * 4;
          pixels[pixelPos] = r;
          pixels[pixelPos + 1] = g;
          pixels[pixelPos + 2] = b;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      originalImageData = imageData;
    }

    function setSelectionAlpha() {
      if (!currentSelection) return;
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;
      for (let i = 0; i < currentSelection.length; i++) {
        if (currentSelection[i]) {
          const pixelPos = i * 4;
          pixels[pixelPos + 3] = 0;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      originalImageData = imageData;
    }

    function clearSelection() {
      currentSelection = null;
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      ctx.putImageData(originalImageData, 0, 0);
    }

    function resetImage() {
      const canvas = document.getElementById('editCanvas');
      const ctx = canvas.getContext('2d');
      ctx.putImageData(originalImageData, 0, 0);
      currentSelection = null;
    }

    function saveImage() {
      const canvas = document.getElementById('editCanvas');
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async function (e) {
          const imageUrl = await websim.upload(file);
          const uploadedImage = new Image();
          uploadedImage.onload = function () {
            currentImage = uploadedImage;
            setupImageEditor();
          };
          uploadedImage.src = e.target.result;
          const tempImg = new Image();
          tempImg.onload = async function () {
            await room.collection('gallery_images').create({
              imageUrl: tempImg.src,
              prompt: file.name,
              views: 0,
              uses: 0
            });
          };
          tempImg.src = imageUrl;
        };
        reader.readAsDataURL(file);
      }
    }

    function generateSelectionFill() {
      if (!currentSelection) return;
      
      const canvas = document.getElementById('editCanvas');
      const promptInput = document.getElementById('selectionPromptInput');
      const prompt = promptInput.value;
      
      if (!prompt.trim()) {
        alert('Please enter a prompt for the selected region');
        return;
      }

      // Create temporary image container if it doesn't exist
      let tempImageContainer = document.getElementById('tempFillImageContainer');
      if (!tempImageContainer) {
        tempImageContainer = document.createElement('div');
        tempImageContainer.id = 'tempFillImageContainer';
        tempImageContainer.style.display = 'none';
        document.body.appendChild(tempImageContainer);
      }

      // Create new image element for generation
      const tempImageId = `fillImage_${Date.now()}`;
      const generatedImage = document.createElement('img');
      generatedImage.id = tempImageId;
      generatedImage.crossOrigin = 'anonymous';
      generatedImage.style.display = 'none';
      generatedImage.src = prompt;
      generatedImage.alt = prompt;

      // Add loading indicator
      const loadingSpinner = document.getElementById('loadingSpinner');
      loadingSpinner.style.display = 'block';

      // Track the initial src
      const initialSrc = generatedImage.src;
      
      generatedImage.onload = function() {
        // Check if src has changed (meaning generation is complete)
        if (generatedImage.src !== initialSrc) {
          loadingSpinner.style.display = 'none';
          
          // Calculate selection bounds
          let minX = canvas.width,
              minY = canvas.height,
              maxX = 0,
              maxY = 0;

          for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
              const pos = y * canvas.width + x;
              if (currentSelection[pos]) {
                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
              }
            }
          }

          const selectionWidth = maxX - minX + 1;
          const selectionHeight = maxY - minY + 1;

          // Initialize selection canvas if needed
          if (!selectionCanvas) {
            selectionCanvas = document.createElement('canvas');
            selectionCtx = selectionCanvas.getContext('2d');
          }

          // Apply the generated image to the selection
          const ctx = canvas.getContext('2d');
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const pixels = imageData.data;

          selectionCanvas.width = selectionWidth;
          selectionCanvas.height = selectionHeight;
          selectionCtx.drawImage(generatedImage, 0, 0, selectionWidth, selectionHeight);
          
          const scaledImageData = selectionCtx.getImageData(0, 0, selectionWidth, selectionHeight);

          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
              const pos = y * canvas.width + x;
              if (currentSelection[pos]) {
                const scaledX = x - minX;
                const scaledY = y - minY;
                const scaledPos = (scaledY * selectionWidth + scaledX) * 4;
                const targetPos = pos * 4;
                
                pixels[targetPos] = scaledImageData.data[scaledPos];
                pixels[targetPos + 1] = scaledImageData.data[scaledPos + 1];
                pixels[targetPos + 2] = scaledImageData.data[scaledPos + 2];
                pixels[targetPos + 3] = scaledImageData.data[scaledPos + 3];
              }
            }
          }

          ctx.putImageData(imageData, 0, 0);
          originalImageData = imageData;
          
          // Cleanup
          tempImageContainer.innerHTML = '';
          document.getElementById('fillImagePrompt').style.display = 'none';
        }
      };

      // Add the image to the temporary container
      tempImageContainer.appendChild(generatedImage);
    }
