<html>
<head>
  <base href="./">
  <title>AI Image Editor</title>
  <script type="importmap">
    {
      "imports": {
        "@websim/use-query": "https://esm.websim.com/@websim/use-query",
        "@websim/websim-socket": "https://esm.websim.com/@websim/websim-socket"
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>AI Image Editor</h1>
    
    <div class="editor-section">
      <div class="input-group">
        <select id="prefixPrompt">
          <option value="">Style Prefix...</option>
          <option value="HD ">HD Quality</option>
          <option value="4K ">4K Ultra HD</option>
          <option value="Cartoon style ">Cartoon Style</option>
          <option value="Realistic ">Realistic</option>
          <option value="Photorealistic ">Photorealistic</option>
          <option value="Black and white ">Black & White</option>
          <option value="Vintage ">Vintage Style</option>
          <option value="Anime style ">Anime Style</option>
        </select>
        <input type="text" id="promptInput" placeholder="Describe your image..." onkeypress="handleKeyPress(event)">
        <select id="suffixPrompt">
          <option value="">Background...</option>
          <option value=", white background">White Background</option>
          <option value=", black background">Black Background</option>
          <option value=", transparent background">Transparent</option>
          <option value=", gradient background">Gradient</option>
          <option value=", professional lighting">Pro Lighting</option>
        </select>
        <button onclick="generateImage()">✨ Gen</button>
        <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)" style="display:none">
        <button onclick="document.getElementById('imageUpload').click()">📁 Upload</button>
        <input type="file" id="referenceImageUpload" accept="image/*" onchange="handleReferenceImageUpload(event)" style="display:none">
        <button onclick="document.getElementById('referenceImageUpload').click()">🖼️ Ref</button>
      </div>

      <div id="referenceImageContainer" style="display: none; margin-bottom: 1rem;">
        <div style="display: flex; gap: 1rem; align-items: flex-start; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
          <img id="referenceImagePreview" style="width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 2px solid rgba(255,255,255,0.2);">
          <div style="flex: 1;">
            <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: rgba(255,255,255,0.9);">Reference Image Description:</div>
            <div id="referenceImageDescription" style="font-size: 0.85rem; line-height: 1.4; color: rgba(255,255,255,0.7); margin-bottom: 0.75rem;">Analyzing image...</div>
            <button onclick="clearReferenceImage()" style="background: linear-gradient(135deg, #f44336, #d32f2f); padding: 0.4rem 0.8rem; font-size: 0.8rem; min-width: auto;">✖ Remove</button>
          </div>
        </div>
      </div>

      <div class="image-container" id="imageContainer">
        <div id="loadingSpinner" class="loading" style="display: none;"></div>
        <div id="placeholderText" class="placeholder-text">✨ Generate an image with AI or upload your own to start editing</div>
        <canvas id="editCanvas"></canvas>
        <div class="editor-controls" id="editorControls" style="display: none;">
          <div class="tool-group">
            <button class="tool-button" onclick="setTool('magicWand')" id="magicWandTool" data-tooltip="Magic Wand Selection">
              <svg viewBox="0 0 24 24">
                <path d="M7,5L3,9L9,15L13,11L7,5M16,12L12,16L14,18L18,14L16,12M12.8,2.6L16,5.8L18.6,3.2L15.4,0L12.8,2.6M21.4,11.6L24,14.2L21.4,16.8L18.8,14.2L21.4,11.6M0,18L3,21L5.6,18.4L2.6,15.4L0,18Z"/>
              </svg>
            </button>
            
            <button class="tool-button" onclick="setTool('fillSelection')" id="fillSelectionTool" data-tooltip="Fill with Color">
              <svg viewBox="0 0 24 24">
                <path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/>
              </svg>
            </button>

            <button class="tool-button" onclick="setTool('setAlpha')" id="setAlphaTool" data-tooltip="Make Transparent">
              <svg viewBox="0 0 24 24">
                <path d="M17.66,8L12,2.35L11,3.44L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/>
              </svg>
            </button>

            <button class="tool-button" onclick="setTool('fillWithImage')" id="fillWithImageTool" data-tooltip="AI Fill Selection">
              <svg viewBox="0 0 24 24">
                <path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/>
              </svg>
            </button>

            <button class="tool-button" onclick="setTool('text')" id="textTool" data-tooltip="Add Text">
              <svg viewBox="0 0 24 24">
                <path d="M18.5,4L19.66,8.35L18.7,8.61C18.25,7.74 17.79,6.87 17.26,6.43C16.73,6 16.11,6 15.5,6H13V16.5C13,17 13,17.5 13.33,17.75C13.67,18 14.33,18 15,18V19H9V18C9.67,18 10.33,18 10.67,17.75C11,17.5 11,17 11,16.5V6H8.5C7.89,6 7.27,6 6.74,6.43C6.21,6.87 5.75,7.74 5.3,8.61L4.34,8.35L5.5,4H18.5Z"/>
              </svg>
            </button>

            <button class="tool-button" onclick="clearSelection()" id="clearSelectionTool" data-tooltip="Clear Selection">
              <svg viewBox="0 0 24 24">
                <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/>
              </svg>
            </button>

            <div class="color-display">
              <div class="color-preview" id="colorPreview"></div>
              <input type="color" id="colorPicker" class="color-picker" value="#ffffff">
              <span class="color-value" id="colorValue">#FFFFFF</span>
            </div>
          </div>
          
          <div class="fill-image-prompt" id="fillImagePrompt" style="display: none;">
            <input type="text" id="selectionPromptInput" placeholder="Describe what to fill the selection with...">
            <button onclick="generateSelectionFill()">🎨 AI Fill</button>
          </div>
          
          <div style="display: flex; gap: 1rem; justify-content: center;">
            <button onclick="resetImage()" style="background: linear-gradient(135deg, #ff9800, #f57c00);">🔄 Reset</button>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button onclick="saveImage()" class="save-button" id="saveButton" style="display: none;">💾 Download</button>
        <button onclick="addToGallery()" class="add-gallery-button" id="addGalleryButton" style="display: none;">🖼️ Save to Gallery</button>
      </div>
    </div>

    <div id="textControls" class="text-controls" style="display: none;">
      <input type="text" id="textInput" placeholder="Enter text..." oninput="updateTextPreview()">
      <div class="text-options">
        <select id="fontFamily">
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Georgia">Georgia</option>
          <option value="Verdana">Verdana</option>
        </select>
        <input type="number" id="fontSize" value="24" min="8" max="72">
        <input type="color" id="textColor" value="#000000">
        <button onclick="commitText()">Apply</button>
        <button onclick="cancelText()">Cancel</button>
      </div>
    </div>

    <div class="gallery-container">
      <div class="gallery-header">
        <div class="gallery-tabs">
          <button class="gallery-tab active" onclick="showGalleryTab('recent')">🕒 Recent</button>
          <button class="gallery-tab" onclick="showGalleryTab('popular')">🔥 Popular</button>
          <button class="gallery-tab" onclick="showGalleryTab('my')">👤 My Images</button>
        </div>
        
        <div id="userFilterInfo" style="display: none;">
          <span>Showing images by: <strong id="userFilterName"></strong></span>
          <button onclick="clearUserFilter()" class="clear-filter-button">✖ Clear</button>
        </div>
        
        <div class="search-container">
          <input type="text" id="gallerySearch" placeholder="Search images..." onkeyup="filterGallery()">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/>
          </svg>
        </div>
      </div>
      <div id="gallery" class="gallery"></div>
      <div class="gallery-pagination" id="galleryPagination">
        <button onclick="changePage(-1)" class="pagination-button" id="prevPage">← Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button onclick="changePage(1)" class="pagination-button" id="nextPage">Next →</button>
      </div>
    </div>
  </div>

  <div id="editTitleDialog" style="display: none;">
    <div class="dialog-content">
      <h3>Edit Image Title</h3>
      <input type="text" id="editTitleInput" placeholder="Enter new title">
      <div class="dialog-buttons">
        <button onclick="cancelTitleEdit()">Cancel</button>
        <button onclick="saveTitleEdit()">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
